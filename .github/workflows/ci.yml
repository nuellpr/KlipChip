name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Test suite butuh SQLite; .env tidak di-commit jadi diset di sini.
      DATABASE_URL: file:./ci.db

    steps:
      - uses: actions/checkout@v4

      # Node 24: scripts/test/*.mjs meng-import file src/*.ts langsung
      # (type stripping bawaan Node), tidak lewat ts-node.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Test Python (test_*.py) menguji translate_lines bilingual dan build_ass_file.
      # Ubuntu-latest sudah punya python3, tapi dipin supaya perubahan versi
      # interpreter tidak diam-diam mengubah perilaku test.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Siapkan schema database
        run: npx prisma db push

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build